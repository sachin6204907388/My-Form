<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<h1>Contact Us</h1>


<form id="contactForm" novalidate>
<div class="field">
<label for="name">Name</label>
<input type="text" id="name" name="name" required />
<small class="error" data-for="name"></small>
</div>


<div class="field">
<label for="email">Email</label>
<input type="email" id="email" name="email" required />
<small class="error" data-for="email"></small>
</div>


<div class="field">
<label for="password">Password</label>
<input type="password" id="password" name="password" minlength="6" required />
<small class="error" data-for="password"></small>
</div>


<div class="field">
<label for="message">Message</label>
<textarea id="message" name="message" rows="4"></textarea>
<small class="error" data-for="message"></small>
</div>


<fieldset class="field-inline">
<legend>Gender</legend>
<label><input type="radio" name="gender" value="male" checked> Male</label>
<label><input type="radio" name="gender" value="female"> Female</label>
<label><input type="radio" name="gender" value="other"> Other</label>
</fieldset>


<div class="field">
<label class="checkbox"><input type="checkbox" id="terms" name="terms"> I agree to the terms</label>
<small class="error" data-for="terms"></small>
</div>


<div class="actions">
<button type="submit">Send</button>
<button type="reset" class="muted">Reset</button>
</div>


<div id="result" class="result" aria-live="polite"></div>
</form>
</main>


<script src="script.js"></script>
</body>
</html>
